name: CI/CD — pharma-ui

on: workflow_dispatch
  
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '26.8.1'   # match your local version
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src/ --ext .js,.jsx

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --ci
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3
    
  build:
      name: Build
      runs-on: ubuntu-latest
      needs: test
      steps:
        - uses: actions/checkout@v5

        - name: Setup Node.js
          uses: actions/setup-node@v5
          with:
            node-version: '26.8.1'
            cache: 'npm'
        
        - name: Install dependencies
          run: npm ci

        - name: Build project
          run: npm run build

        - name: Upload build artifacts
          uses: actions/upload-artifact@v6
          with:
            name: build-artifacts
            path: build/

  docker-build-push:
        name: Docker Build and Push
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'workflow_dispatch'
        outputs:
          image-tag: ${{ steps.set-image-tag.outputs.image-tag }}
        steps:
          - uses: actions/checkout@v5

          - name: Set short SHA for Docker image tag
            id: set-image-tag
            run: echo "image-tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

          - name: Log in to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ vars.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}
          
          - name: Build docker image
            run: docker build -t ${{ vars.DOCKER_USERNAME }}/pharnaapp:${{ steps.set-image-tag.outputs.image-tag }} .

          - name: Push docker image
            run: docker push ${{ vars.DOCKER_USERNAME }}/pharnaapp:${{ steps.set-image-tag.outputs.image-tag }}
  
  deploy-dev:
    name: Deploy — DEV
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          path: _gitops

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update image tag — DEV
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
        run: |
          yq e ".image.tag = \"${IMAGE_TAG}\"" -i \
            "_gitops/frontend/values.yaml"
          cd _gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && echo "Already up to date" && exit 0
          git commit -m "ci(dev): update pharma-ui → ${IMAGE_TAG}"
          git push 